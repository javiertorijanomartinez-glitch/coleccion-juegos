<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b54" />
      <stop offset="50%" stop-color="#ffb26b" />
      <stop offset="100%" stop-color="#ffd56b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#ff7b54" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect x="10" y="10" width="80" height="80" rx="20" fill="url(#grad)" filter="url(#glow)"/>
  <!-- Puntos del dado -->
  <circle cx="30" cy="30" r="7" fill="#ffffff" />
  <circle cx="70" cy="30" r="7" fill="#ffffff" />
  <circle cx="50" cy="50" r="7" fill="#ffffff" />
  <circle cx="30" cy="70" r="7" fill="#ffffff" />
  <circle cx="70" cy="70" r="7" fill="#ffffff" />
</svg>
